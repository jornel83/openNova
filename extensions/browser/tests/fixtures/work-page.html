<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>OpenNova M0 工作页</title>
<h1>OpenNova 浏览器接入验证</h1><p id="selection">这段文字用于验证：切到 Nova 对话窗口后，工作选区仍然保留。</p>
<p><a id="article" href="https://developer.chrome.com/docs/extensions/develop/concepts/declare-permissions">Chrome 扩展权限文档</a></p>
<button id="route">SPA 跳转</button><button id="replace">替换链接</button><button id="long">显示超长正文</button>
<p id="hidden" hidden>HIDDEN_SENTINEL</p><input type="password" value="PASSWORD_SENTINEL"><textarea>TEXTAREA_SECRET_SENTINEL</textarea>
<p id="animation">动画计数：0</p><div id="longtext"></div><iframe title="跨域内容" src="https://example.com" style="height:80px"></iframe>
<script>
route.onclick=()=>{history.pushState({},'', '?chapter=2');document.title='OpenNova M0 第二章';selection.textContent='第二章：旧选区与页面引用应失效。';};
replace.onclick=()=>{const a=document.getElementById('article');a.replaceWith(a.cloneNode(true));};
long.onclick=()=>{longtext.textContent='长文本验证。'.repeat(3000);};
let count=0;setInterval(()=>animation.textContent='动画计数：'+(++count),1000);
</script></html>
